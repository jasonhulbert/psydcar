AWSTemplateFormatVersion: '2010-09-09'
Description: Psydcar device pairing and sync API using an existing private S3 bucket and Lambda role.

Parameters:
  SyncBucket:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  SyncRoleArn:
    Type: String
    AllowedPattern: 'arn:[a-z-]+:iam::[0-9]{12}:role/.+'
  ArtifactKey:
    Type: String
    AllowedPattern: 'deployments/sync/[a-f0-9]{64}\.zip'
  EnrollmentDigest:
    Type: String
    NoEcho: true
    AllowedPattern: '[a-f0-9]{64}'

Resources:
  Handler:
    Type: AWS::Lambda::Function
    Properties:
      Architectures: [arm64]
      Code:
        S3Bucket: !Ref SyncBucket
        S3Key: !Ref ArtifactKey
      Handler: cloud.sync.handler.handler
      Role: !Ref SyncRoleArn
      Runtime: python3.13
      MemorySize: 256
      Timeout: 25
      Environment:
        Variables:
          PSYDCAR_SYNC_BUCKET: !Ref SyncBucket
          PSYDCAR_SYNC_ENROLLMENT_DIGEST: !Ref EnrollmentDigest

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-sync'
      ProtocolType: HTTP

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt Handler.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 28000

  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /v1/sync
      Target: !Sub 'integrations/${Integration}'

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Handler
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/$default/POST/v1/sync'

Outputs:
  SyncUrl:
    Description: HTTPS endpoint for PSYDCAR_SYNC_URL.
    Value: !Sub '${HttpApi.ApiEndpoint}/v1/sync'
