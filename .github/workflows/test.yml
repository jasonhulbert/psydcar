name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Psydcar
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m unittest discover -s tests -v

  app:
    name: Angular production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -e .
          npm --prefix app ci
          npm --prefix editor ci
      - name: Check API contract and build
        run: |
          python -m psydcar.api > "$RUNNER_TEMP/psydcar-openapi.json"
          npm --prefix app run generate:api -- --input "$RUNNER_TEMP/psydcar-openapi.json"
          git diff --exit-code -- app/src/api-client
          npm --prefix editor run build
          npm --prefix app run build
      - name: Install browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Check editing and review journeys
        run: npm --prefix app run test:e2e
