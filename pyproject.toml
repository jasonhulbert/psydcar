[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "psydcar"
version = "0.1.2"
description = "Local knowledge sidecars for coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=6.0,<7", "mcp>=2.3,<3"]

[project.scripts]
psydcar = "psydcar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
psydcar = ["dashboard_assets/*"]
