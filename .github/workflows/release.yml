name: Psydcar release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install . 'pyinstaller==6.22.0'
      - name: Build release archive
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: sh scripts/build-release.sh
      - name: Check installed command
        run: sh scripts/check-release-install.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/psydcar-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach both assets to tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          macos=(dist/psydcar-*-macos-arm64.tar.gz)
          linux=(dist/psydcar-*-linux-x86_64.tar.gz)
          test "${#macos[@]}" -eq 1 && test -f "${macos[0]}"
          test "${#linux[@]}" -eq 1 && test -f "${linux[0]}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${macos[0]}" "${linux[0]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${macos[0]}" "${linux[0]}" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
