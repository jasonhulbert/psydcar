name: Psydcar release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Check package metadata and contents
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m twine check --strict dist/*
          python scripts/check-pypi-dist.py "$RELEASE_TAG" dist
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - name: Publish wheel and source distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  public-install:
    needs: publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple silicon macOS 15 runner
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 15
      - name: Install from public PyPI and exercise Psydcar
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PIP_INDEX_URL: https://pypi.org/simple/
          PIP_EXTRA_INDEX_URL: ''
          PIP_CONFIG_FILE: /dev/null
        run: sh scripts/check-pypi-install.sh "$RELEASE_TAG"
